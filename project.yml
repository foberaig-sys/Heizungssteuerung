# Xcode-Projekt erzeugen: `brew install xcodegen && xcodegen generate`, dann Heizung.xcodeproj öffnen.
name: Heizung
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  KebaKit:
    path: KebaKit

targets:
  Heizung:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: KebaKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Heizung
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: Die App verbindet sich mit dem Regler deiner Wärmepumpe im Heimnetz.
        NSAppTransportSecurity:
          # Der Regler im Heimnetz spricht nur HTTP (ohne TLS).
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.heizung
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        # Eigene Team-ID eintragen (Xcode → Signing & Capabilities).
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1"
